<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6a6a6a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5ca3ff"/>
    </marker>
    <style>
      .box  { fill:#141414; stroke:#343434; stroke-width:1.2; }
      .key  { fill:#10161f; stroke:#5ca3ff; stroke-width:1.4; }
      .wip  { fill:#141414; stroke:#e8a33d; stroke-width:1.4; stroke-dasharray:6 4; }
      .t    { fill:#ededed; font-size:14.5px; font-weight:600; }
      .s    { fill:#9a9a9a; font-size:12px; }
      .lane { fill:#8a8a8a; font-size:12.5px; }
      .ln   { stroke:#6a6a6a; stroke-width:1.4; fill:none; }
      .lnb  { stroke:#5ca3ff; stroke-width:1.4; fill:none; }
    </style>
  </defs>
  <rect width="960" height="410" fill="#0a0a0a"/>

  <!-- lane labels -->
  <text class="lane" x="440" y="30">Per source, about 30 times a second</text>
  <text class="lane" x="440" y="262">Per listener, 4 times a second</text>

  <!-- materials -->
  <rect class="box" x="16" y="150" width="182" height="100" rx="7"/>
  <text class="t" x="30" y="180">Acoustic materials</text>
  <text class="s" x="30" y="202">absorption, transmission</text>
  <text class="s" x="30" y="219">and scattering per band,</text>
  <text class="s" x="30" y="236">baked once per asset</text>

  <!-- tracer -->
  <rect class="key" x="232" y="150" width="168" height="100" rx="7"/>
  <text class="t" x="246" y="180">Ray tracer</text>
  <text class="s" x="246" y="202">rays start at the</text>
  <text class="s" x="246" y="219">listener, run on a</text>
  <text class="s" x="246" y="236">background thread</text>
  <path class="ln" d="M198,200 L228,200" marker-end="url(#arr)"/>

  <!-- branch -->
  <path class="lnb" d="M400,200 L418,200 L418,90 L436,90" marker-end="url(#arrb)"/>
  <path class="lnb" d="M418,200 L418,322 L436,322" marker-end="url(#arrb)"/>

  <!-- per-source lane -->
  <rect class="box" x="440" y="42" width="156" height="96" rx="7"/>
  <text class="t" x="454" y="70">Direct + NEE</text>
  <text class="s" x="454" y="92">wall crossings on the</text>
  <text class="s" x="454" y="109">direct line, plus shadow</text>
  <text class="s" x="454" y="126">rays from each bounce</text>

  <rect class="box" x="620" y="42" width="148" height="96" rx="7"/>
  <text class="t" x="634" y="70">Occlusion</text>
  <text class="s" x="634" y="92">energy per band that</text>
  <text class="s" x="634" y="109">reaches the listener</text>
  <text class="s" x="634" y="126">from this source</text>
  <path class="ln" d="M596,90 L616,90" marker-end="url(#arr)"/>

  <rect class="box" x="792" y="42" width="152" height="96" rx="7"/>
  <text class="t" x="806" y="70">Voice filter</text>
  <text class="s" x="806" y="92">3-band gains, square</text>
  <text class="s" x="806" y="109">root of energy, plus</text>
  <text class="s" x="806" y="126">an air lowpass</text>
  <path class="ln" d="M768,90 L788,90" marker-end="url(#arr)"/>

  <!-- per-listener lane -->
  <rect class="box" x="440" y="274" width="156" height="96" rx="7"/>
  <text class="t" x="454" y="302">Echogram</text>
  <text class="s" x="454" y="324">diffuse-rain deposits,</text>
  <text class="s" x="454" y="341">1 ms bins, 6 bands,</text>
  <text class="s" x="454" y="358">averaged over probes</text>

  <rect class="box" x="620" y="274" width="148" height="96" rx="7"/>
  <text class="t" x="634" y="302">Decay analysis</text>
  <text class="s" x="634" y="324">Schroeder curve,</text>
  <text class="s" x="634" y="341">EDT, T20, T30, and</text>
  <text class="s" x="634" y="358">an Eyring cross-check</text>
  <path class="ln" d="M596,322 L616,322" marker-end="url(#arr)"/>

  <rect class="wip" x="792" y="274" width="152" height="96" rx="7"/>
  <text class="t" x="806" y="302">FDN reverb</text>
  <text class="s" x="806" y="324">16 delay lines, decay</text>
  <text class="s" x="806" y="341">set per band from the</text>
  <text class="s" x="806" y="358">measured RT60</text>
  <path class="ln" d="M768,322 L788,322" marker-end="url(#arr)"/>

  <!-- send level: occlusion estimate scales the reverb send -->
  <path class="ln" d="M694,138 L694,206 L868,206 L868,270" stroke-dasharray="3 4" marker-end="url(#arr)"/>
  <text class="s" x="706" y="200">reverb send level</text>

  <!-- legend -->
  <rect x="16" y="382" width="22" height="14" rx="3" fill="#141414" stroke="#343434" stroke-width="1.2"/>
  <text class="s" x="46" y="393">working</text>
  <rect x="112" y="382" width="22" height="14" rx="3" fill="#141414" stroke="#e8a33d" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text class="s" x="142" y="393">in progress</text>
</svg>
